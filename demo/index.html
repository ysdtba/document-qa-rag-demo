<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文档问答演示</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6f7; color: #17202a; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #dfe3e7; padding: 18px max(24px, calc((100vw - 1000px) / 2)); }
    h1 { font-size: 20px; margin: 0 0 5px; font-weight: 650; }
    header p { margin: 0; color: #596674; font-size: 13px; }
    main { max-width: 1000px; margin: 0 auto; padding: 28px 24px 40px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr); gap: 24px; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    .panel { background: #fff; border: 1px solid #dfe3e7; border-radius: 6px; padding: 20px; }
    .chat { min-height: 440px; display: flex; flex-direction: column; gap: 18px; }
    .answer { white-space: pre-wrap; line-height: 1.7; min-height: 120px; }
    .status { color: #596674; font-size: 13px; min-height: 20px; }
    .status.error { color: #ac2f2f; }
    .sources { margin: 0; padding-left: 18px; line-height: 1.5; font-size: 13px; }
    .sources li { margin-bottom: 15px; }
    .sources small { display: block; color: #596674; margin-top: 4px; }
    form { margin-top: auto; display: flex; gap: 8px; }
    input { min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #aab5bf; border-radius: 4px; font: inherit; font-size: 14px; }
    button { border: 0; border-radius: 4px; background: #176b62; color: white; font: inherit; font-size: 14px; padding: 10px 18px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .notice { margin-top: 16px; color: #596674; font-size: 12px; line-height: 1.5; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; padding: 16px; } .chat { min-height: 320px; } header { padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>文档问答演示</h1>
    <p>混合检索 · 引用来源 · 流式回答</p>
  </header>
  <main>
    <section class="panel chat" aria-label="问答">
      <div>
        <h2>回答</h2>
        <div id="answer" class="answer" aria-live="polite">输入问题开始查询。</div>
        <div id="status" class="status"></div>
      </div>
      <form id="form">
        <input id="question" aria-label="问题" maxlength="2000" placeholder="例如：示例文档中的理赔申请期限是多少？" required>
        <button id="submit" type="submit">提问</button>
      </form>
    </section>
    <aside class="panel">
      <h2>引用片段</h2>
      <ol id="sources" class="sources"></ol>
      <p class="notice">知识库包含虚构演示文档。所有规则、期限和金额仅用于展示检索功能，不代表真实法规或投资建议。</p>
    </aside>
  </main>
  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const answer = document.getElementById("answer");
    const sources = document.getElementById("sources");
    const status = document.getElementById("status");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      submit.disabled = true;
      answer.textContent = "";
      sources.replaceChildren();
      status.className = "status";
      status.textContent = "正在检索...";
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail || `请求失败 (${response.status})`);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let complete = false;
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const frames = buffer.split(/\r?\n\r?\n/);
          buffer = frames.pop();
          for (const frame of frames) {
            const line = frame.split(/\r?\n/).find((part) => part.startsWith("data: "));
            if (!line) continue;
            const payload = line.slice(6);
            if (payload === "[DONE]") { complete = true; continue; }
            const eventData = JSON.parse(payload);
            if (eventData.type === "sources") {
              for (const source of eventData.data) {
                const item = document.createElement("li");
                item.textContent = source.section || "未命名片段";
                const preview = document.createElement("small");
                preview.textContent = source.preview || "";
                item.append(preview);
                sources.append(item);
              }
              status.textContent = "正在生成回答...";
            }
            if (eventData.type === "token") answer.textContent += eventData.data;
          }
          if (done) break;
        }
        status.textContent = complete ? "完成" : "连接已中断，请重试。";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
